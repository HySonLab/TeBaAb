seed: 0
device: 'cuda'
num_samples: 20
num_elites: 10
num_generations: 5
beam_size: 5

# Checkpoint paths — optimize.py picks the right one based on model.use_description.
# Override with ++model_path=<path> to use a specific checkpoint regardless.
model_path_w_des: 'checkpoints/cvae/best_w_des.ckpt'
model_path_wo_des: 'checkpoints/cvae/best_wo_des.ckpt'

data:
  ab_embedding_path: ''
  ag_embedding_path: ''
  ab_description_embedding_path: ''
  abset_path: ''
  batch_size: 32
  # Mirror the training split so optimize.py sees only the held-out test samples.
  train_size: 0.8
  val_size: 0.1
  test_size: 0.1
  num_workers: 4
  # text_mode: real | shuffle | random | zero  (inference-time ablation)
  text_mode: 'real'


trainer:
  gpus: 2
  max_epochs: 100
  model_output_dir: 'models'
  save_top_k: 3
  accelerator: 'cuda'
  save_every_n_epochs: 5
  strategy: 'ddp_find_unused_parameters_true'
  num_nodes: 2

optimizer:
  lr: 0.001

model:
  embed_dimen: 480
  latent_dimen: 64
  ab_dimen: 1024
  ag_dimen: 960
  des_dimen: 768
  max_ab_seq_len: 256
  reduction: 'mean'
  use_pcgrad: 0
  use_concat_condition: 1
  # use_description: 1 → With Description model (best_w_des.ckpt)
  # use_description: 0 → Without Description model (best_wo_des.ckpt)
  use_description: 1
  nll_weight: 1
  mse_weight: 1
  kl_weight: 1
  beta_min: 0.0
  beta_max: 1.0
  Kp: 0.01
  Ki: 0.0001
  expected_kl: 20

  encoder:
    pretrained_model_name_or_path: 'esmc'
    access_token_read: ''
    hidden_dim: 960
  decoder:
    name: 'Transformer'
    hidden_dim: 512
    num_layers: 1
    sos_idx: 0
    attn_method: 'general'
    use_teacher_forcing: 0.0
    padding_idx: 1
    inp_dropout: 0.45
    gru_dropout: 0.1
  upsampler:
    max_filter: 512
    min_deconv_dim: 32
    num_deconv_layers: 3
    kernel_size: 2
    stride: 2
    padding: 0
    dropout: 0.2
    act_type: 'relu'
  predictor:
    pred_hidden_dim: 256
    pred_dropout: 0.2
    contrastive_model_path: 'checkpoints/affinity_predictor/ab_ag_clip.pth'
    cross_attention_model_path: 'checkpoints/affinity_predictor/cross_attention_model.pth'
